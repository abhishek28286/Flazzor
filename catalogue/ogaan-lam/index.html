<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#171717">
<title>Ogaan Lam Colour Catalogue | Flazzor Interiors</title>
<style>
:root{color-scheme:dark;--bg:#171717;--panel:#242424;--text:#f5f5f5;--muted:#b8b8b8;--accent:#d5b47a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Arial,sans-serif;min-height:100vh}
header{padding:13px 16px;text-align:center;border-bottom:1px solid #393939}
header strong{display:block;font-size:18px;letter-spacing:.4px}header small{color:var(--muted)}
main{max-width:1200px;margin:auto;padding:12px}
#status{text-align:center;color:var(--muted);padding:12px}
#book-wrap{display:flex;justify-content:center;align-items:center;min-height:65vh;overflow:hidden}
#book{margin:auto}
.page{background:#fff;overflow:hidden}.page canvas{display:block;width:100%;height:100%;object-fit:contain}
.toolbar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:14px 4px}
button{border:1px solid #555;background:var(--panel);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;cursor:pointer}
button.primary{background:var(--accent);color:#171717;border-color:var(--accent);font-weight:700}
button:disabled{opacity:.35;cursor:not-allowed}
#counter{min-width:92px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{text-align:center;color:var(--muted);font-size:12px;padding-bottom:14px}
#zoomModal{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.94);padding:12px}
#zoomModal.open{display:flex;flex-direction:column}
.zoombar{display:flex;justify-content:center;gap:8px;align-items:center;padding-bottom:10px;flex-wrap:wrap}
#zoomViewport{flex:1;overflow:auto;text-align:center;background:#222;border-radius:8px;touch-action:pan-x pan-y}
#zoomCanvas{max-width:none;display:block;margin:0 auto;transform-origin:top left}
footer{text-align:center;color:#888;font-size:11px;padding:10px}
@media(max-width:600px){header strong{font-size:16px}main{padding:4px}button{padding:9px 11px}#book-wrap{min-height:58vh}}
</style>
</head>
<body>
<header><strong>OGAAN LAM COLOUR CATALOGUE</strong><small>Solid Colours &amp; Textures · Presented by Flazzor Interiors</small></header>
<main>
  <div id="status">Loading catalogue… Please wait.</div>
  <div id="book-wrap"><div id="book"></div></div>
  <div class="toolbar">
    <button id="prev" disabled>← Previous</button>
    <span id="counter">Page – / –</span>
    <button id="next" disabled>Next →</button>
    <button id="zoom" disabled>＋ Zoom Colour</button>
    <button id="fullscreen">⛶ Full Screen</button>
  </div>
  <div class="hint">Tap a page edge or swipe to turn pages. Use “Zoom Colour” to inspect the current page in detail.</div>
</main>
<footer>Flazzor Interiors · Udaipur</footer>

<div id="zoomModal" aria-hidden="true">
  <div class="zoombar">
    <button id="zoomOut">−</button><span id="zoomLevel">100%</span><button id="zoomIn">＋</button>
    <button id="zoomReset">Reset</button><button id="zoomClose" class="primary">Close ✕</button>
  </div>
  <div id="zoomViewport"><canvas id="zoomCanvas"></canvas></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(() => {
  const PDF_FILE = "ogaan-lam-catalogue.pdf";
  const $ = id => document.getElementById(id);
  const status = $("status"), bookEl = $("book");
  let pdfDoc, pageFlip, currentPage = 0, zoomScale = 1, zoomBase = 1;
  const PAGE_W = 500, PAGE_H = 707;

  function setStatus(msg){ status.textContent = msg; }
  function updateControls(){
    if(!pdfDoc) return;
    $("counter").textContent = `Page ${Math.min(currentPage+1,pdfDoc.numPages)} / ${pdfDoc.numPages}`;
    $("prev").disabled = currentPage <= 0;
    $("next").disabled = currentPage >= pdfDoc.numPages-1;
    $("zoom").disabled = false;
  }
  async function renderThumb(pageNo, canvas){
    const page = await pdfDoc.getPage(pageNo);
    const viewport = page.getViewport({scale: 0.82});
    const ctx = canvas.getContext("2d", {alpha:false});
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    await page.render({canvasContext:ctx, viewport}).promise;
  }
  async function openZoom(){
    const page = await pdfDoc.getPage(currentPage+1);
    const vp = page.getViewport({scale: 1.8});
    const c = $("zoomCanvas"), ctx = c.getContext("2d", {alpha:false});
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    zoomBase = Math.min(($("zoomViewport").clientWidth-24)/c.width, 1);
    zoomScale = zoomBase;
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    applyZoom();
    $("zoomModal").classList.add("open");
    $("zoomModal").setAttribute("aria-hidden","false");
  }
  function applyZoom(){
    const c=$("zoomCanvas");
    c.style.width=(c.width*zoomScale)+"px";
    c.style.height=(c.height*zoomScale)+"px";
    $("zoomLevel").textContent=Math.round(zoomScale/zoomBase*100)+"%";
  }
  async function init(){
    if(!window.pdfjsLib){setStatus("Could not load the PDF viewer library. Check your internet connection and refresh.");return;}
    if(!window.St || !window.St.PageFlip){setStatus("Could not load the page-flip library. Check your internet connection and refresh.");return;}
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    try{
      const loading=pdfjsLib.getDocument({url:PDF_FILE});
      pdfDoc=await loading.promise;
      setStatus(`Preparing ${pdfDoc.numPages} pages…`);
      const pages=[];
      for(let i=1;i<=pdfDoc.numPages;i++){
        const el=document.createElement("div"); el.className="page";
        const canvas=document.createElement("canvas"); el.appendChild(canvas); bookEl.appendChild(el); pages.push(el);
        await renderThumb(i,canvas);
        if(i%5===0 || i===pdfDoc.numPages) setStatus(`Preparing pages ${i} / ${pdfDoc.numPages}…`);
      }
      pageFlip=new St.PageFlip(bookEl,{
        width:PAGE_W,height:PAGE_H,size:"stretch",minWidth:260,maxWidth:PAGE_W,
        minHeight:368,maxHeight:PAGE_H,showCover:true,usePortrait:true,
        mobileScrollSupport:false,drawShadow:true,maxShadowOpacity:.35,
        flippingTime:650,autoSize:true
      });
      pageFlip.loadFromHTML(pages);
      pageFlip.on("flip",e=>{currentPage=e.data;updateControls();});
      $("prev").disabled=false;$("next").disabled=false;
      updateControls();setStatus("Catalogue ready.");
      setTimeout(()=>{status.style.display="none";},1800);
    }catch(err){
      console.error(err);
      setStatus("Unable to open the catalogue. Make sure ogaan-lam-catalogue.pdf is in the same folder as index.html.");
    }
  }
  $("prev").addEventListener("click",()=>pageFlip&&pageFlip.flipPrev());
  $("next").addEventListener("click",()=>pageFlip&&pageFlip.flipNext());
  $("zoom").addEventListener("click",()=>openZoom().catch(console.error));
  $("fullscreen").addEventListener("click",async()=>{
    try{if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen();}catch(e){}
  });
  $("zoomClose").addEventListener("click",()=>{$("zoomModal").classList.remove("open");$("zoomModal").setAttribute("aria-hidden","true");});
  $("zoomIn").addEventListener("click",()=>{zoomScale=Math.min(zoomScale*1.25,zoomBase*4);applyZoom();});
  $("zoomOut").addEventListener("click",()=>{zoomScale=Math.max(zoomScale/1.25,zoomBase*.65);applyZoom();});
  $("zoomReset").addEventListener("click",()=>{zoomScale=zoomBase;applyZoom();});
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape") $("zoomClose").click();
    if(e.key==="ArrowLeft" && pageFlip) pageFlip.flipPrev();
    if(e.key==="ArrowRight" && pageFlip) pageFlip.flipNext();
  });
  init();
})();
</script>
</body>
</html>
