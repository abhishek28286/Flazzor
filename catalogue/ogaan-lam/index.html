<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#171717"><title>Ogaan Lam Colour Catalogue | Flazzor Interiors</title><style>
:root{color-scheme:dark;--bg:#171717;--panel:#242424;--text:#f5f5f5;--muted:#b8b8b8;--accent:#d5b47a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Arial,sans-serif;min-height:100vh}header{padding:13px 16px;text-align:center;border-bottom:1px solid #393939}header strong{display:block;font-size:18px}header small{color:var(--muted)}main{max-width:1200px;margin:auto;padding:12px}#status{text-align:center;color:var(--muted);padding:12px}#book-wrap{display:flex;justify-content:center;align-items:center;min-height:65vh;overflow:hidden}#book{margin:auto}.page{background:#fff;overflow:hidden}.page canvas{display:block;width:100%;height:100%;object-fit:contain}.toolbar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:14px 4px}button{border:1px solid #555;background:var(--panel);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px}button.primary{background:var(--accent);color:#171717;font-weight:700}button:disabled{opacity:.35}#counter{min-width:92px;text-align:center;color:var(--muted)}.hint{text-align:center;color:var(--muted);font-size:12px;padding-bottom:14px}#zoomModal{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.94);padding:12px}#zoomModal.open{display:flex;flex-direction:column}.zoombar{display:flex;justify-content:center;gap:8px;align-items:center;padding-bottom:10px;flex-wrap:wrap}#zoomViewport{flex:1;overflow:auto;background:#222;border-radius:8px}#zoomCanvas{max-width:none;display:block;margin:0 auto}footer{text-align:center;color:#888;font-size:11px;padding:10px}@media(max-width:600px){header strong{font-size:16px}main{padding:4px}button{padding:9px 11px}#book-wrap{min-height:58vh}}
</style></head><body><header><strong>OGAAN LAM COLOUR CATALOGUE</strong><small>Solid Colours &amp; Textures · Presented by Flazzor Interiors</small></header><main><div id="status">Opening catalogue…</div><div id="book-wrap"><div id="book"></div></div><div class="toolbar"><button id="prev" disabled>← Previous</button><span id="counter">Page – / –</span><button id="next" disabled>Next →</button><button id="zoom" disabled>＋ Zoom Colour</button><button id="fullscreen">⛶ Full Screen</button></div><div class="hint">Swipe or tap to turn pages. Use Zoom Colour to inspect the current page.</div></main><footer>Flazzor Interiors · Udaipur</footer><div id="zoomModal" aria-hidden="true"><div class="zoombar"><button id="zoomOut">−</button><span id="zoomLevel">100%</span><button id="zoomIn">＋</button><button id="zoomReset">Reset</button><button id="zoomClose" class="primary">Close ✕</button></div><div id="zoomViewport"><canvas id="zoomCanvas"></canvas></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script>
(()=>{const PDF_FILE='ogaan-lam-catalogue.pdf',$=id=>document.getElementById(id);let pdfDoc,pageFlip,currentPage=0,zoomScale=1,zoomBase=1;const rendered=new Set(),rendering=new Set();function controls(){if(!pdfDoc)return;$('counter').textContent=`Page ${currentPage+1} / ${pdfDoc.numPages}`;$('prev').disabled=currentPage<=0;$('next').disabled=currentPage>=pdfDoc.numPages-1}
async function renderPage(n){if(n<1||n>pdfDoc.numPages||rendered.has(n)||rendering.has(n))return;rendering.add(n);try{const p=await pdfDoc.getPage(n),c=document.querySelector(`[data-pdf-page="${n}"]`);if(!c)return;const scale=Math.min(1.05,Math.max(.7,window.devicePixelRatio||1)),vp=p.getViewport({scale});c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);await p.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp}).promise;rendered.add(n)}catch(e){console.error(e)}finally{rendering.delete(n)}}function renderNearby(){[currentPage+1,currentPage+2,currentPage,currentPage-1].forEach(renderPage)}
async function showZoom(){const p=await pdfDoc.getPage(currentPage+1),c=$('zoomCanvas'),vp=p.getViewport({scale:2.1});c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);await p.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp}).promise;zoomBase=Math.min(($('zoomViewport').clientWidth-24)/c.width,1);zoomScale=zoomBase;applyZoom();$('zoomModal').classList.add('open');$('zoomModal').setAttribute('aria-hidden','false')}function applyZoom(){const c=$('zoomCanvas');c.style.width=c.width*zoomScale+'px';c.style.height=c.height*zoomScale+'px';$('zoomLevel').textContent=Math.round(zoomScale/zoomBase*100)+'%'}
async function init(){try{if(!window.pdfjsLib||!window.St?.PageFlip)throw Error('Viewer libraries did not load');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdfDoc=await pdfjsLib.getDocument({url:PDF_FILE,rangeChunkSize:65536}).promise;const shells=[];for(let n=1;n<=pdfDoc.numPages;n++){const el=document.createElement('div');el.className='page';const c=document.createElement('canvas');c.dataset.pdfPage=n;el.appendChild(c);shells.push(el)}pageFlip=new St.PageFlip($('book'),{width:500,height:707,size:'stretch',minWidth:260,maxWidth:500,minHeight:368,maxHeight:707,showCover:true,usePortrait:true,mobileScrollSupport:false,drawShadow:true,maxShadowOpacity:.35,flippingTime:600,autoSize:true});pageFlip.loadFromHTML(shells);pageFlip.on('flip',e=>{currentPage=e.data;controls();renderNearby()});$('prev').disabled=false;$('next').disabled=false;$('zoom').disabled=false;controls();renderNearby();$('status').textContent=`Catalogue ready · ${pdfDoc.numPages} pages. Pages load as you browse.`;setTimeout(()=>$('status').style.display='none',2500)}catch(e){console.error(e);$('status').textContent='Catalogue could not load. Check that the PDF is beside index.html and refresh.'}}
$('prev').onclick=()=>pageFlip?.flipPrev();$('next').onclick=()=>pageFlip?.flipNext();$('zoom').onclick=()=>showZoom().catch(console.error);$('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};$('zoomClose').onclick=()=>{$('zoomModal').classList.remove('open');$('zoomModal').setAttribute('aria-hidden','true')};$('zoomIn').onclick=()=>{zoomScale=Math.min(zoomScale*1.25,zoomBase*4);applyZoom()};$('zoomOut').onclick=()=>{zoomScale=Math.max(zoomScale/1.25,zoomBase*.65);applyZoom()};$('zoomReset').onclick=()=>{zoomScale=zoomBase;applyZoom()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('zoomClose').click();if(e.key==='ArrowLeft')pageFlip?.flipPrev();if(e.key==='ArrowRight')pageFlip?.flipNext()});init()})();
</script></body></html>
